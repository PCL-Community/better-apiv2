[package]
name = "better-apiv2"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }

# Redis
redis = { version = "0.28", features = ["aio", "tokio-comp", "connection-manager"] }
tokio-util = { version = "0.7", features = ["io"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# DateTime
chrono = { version = "0.4", features = ["serde"] }

# Async helpers
futures = "0.3"
tempfile = "3"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Crypto
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
dotenvy = "0.15"
once_cell = "1"

# Multipart form
axum-extra = { version = "0.10", features = ["multipart"] }

# Error handling
thiserror = "2"
anyhow = "1"

# S3
aws-sdk-s3 = "1"
aws-config = "1"

# Rate limiting (simple sliding window)
dashmap = "6"
